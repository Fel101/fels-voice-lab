name: Source verification
on:
  # Branches only: a pushed tag is checked by release.yml, which calls this workflow before it publishes.
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The commit to check, such as refs/tags/v0.3.0. Empty checks the caller's own commit.
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint
        run: |
          python -m pip install -r requirements/lint.txt
          ruff check .
          ruff format --check .
      - name: Install core only
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements/core.txt
      - name: Contracts and synthetic audio
        run: .venv/Scripts/python.exe -m unittest discover -s tests -p "test_*.py" -v
      - name: Frontend contracts
        run: node --test tests/ui_workspace.test.cjs tests/drama3_studio.test.cjs tests/theme.test.cjs tests/voice_workflows.test.cjs tests/voice_library.test.cjs tests/compare_cast.test.cjs tests/cast_reference_ui.test.cjs tests/engine_status.test.cjs tests/scene_history.test.cjs tests/take_edit_ui.test.cjs tests/updates_ui.test.cjs
      - name: Check the repository for secrets, private files and dead links
        run: .venv/Scripts/python.exe tools/check_repo.py
  setup-without-python:
    # setup.bat on a computer with no Python: it fetches the Lab's own (tools/get_python.ps1), sets up the core, and the Lab starts.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Hide this runner's Python, run setup.bat, start the Lab
        run: |
          foreach ($launcher in "$env:SystemRoot\py.exe", "$env:SystemRoot\pyw.exe") {
            if (Test-Path $launcher) { Remove-Item $launcher -Force }
          }
          $env:PATH = ($env:PATH -split ';' | Where-Object {
            $_ -and -not (Test-Path (Join-Path $_ 'python.exe')) -and -not (Test-Path (Join-Path $_ 'py.exe'))
          }) -join ';'
          if (Get-Command py -ErrorAction SilentlyContinue) { throw "py is still on the PATH" }
          if (Get-Command python -ErrorAction SilentlyContinue) { throw "python is still on the PATH" }
          cmd /c ".\setup.bat --models none --yes --no-desktop < NUL"
          if ($LASTEXITCODE) { throw "setup.bat failed" }
          if (-not (Test-Path python\python.exe)) { throw "setup.bat did not fetch the Lab's own Python" }
          $lab = Start-Process .venv\Scripts\python.exe -ArgumentList 'serve.py', '--port', '8790' -PassThru -NoNewWindow
          $health = $null
          foreach ($try in 1..60) {
            try { $health = Invoke-RestMethod http://127.0.0.1:8790/api/health -TimeoutSec 2; break } catch { Start-Sleep 1 }
          }
          Stop-Process -Id $lab.Id -Force
          if ($health.status -ne 'ready') { throw "The Lab did not answer /api/health" }
          "The Lab started on its own Python: version $($health.version)"
  installer:
    # Setup.exe from this commit: build it (Inno Setup is on the runner), install it silently into a temporary folder, start
    # the Lab, put one character in its library, then uninstall it and find the library still there and the program gone.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Setup.exe
        run: python tools/build_installer.py --ref HEAD --output "$env:RUNNER_TEMP\installer"
      - name: Install it silently, start the Lab, uninstall it
        run: |
          $setup = Get-ChildItem "$env:RUNNER_TEMP\installer\FelsVoiceLab-Setup-*.exe" | Select-Object -First 1
          $lab = Join-Path $env:RUNNER_TEMP 'FelsVoiceLab'
          $arguments = '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$lab`"", "/LOG=`"$env:RUNNER_TEMP\setup.log`""
          $install = Start-Process $setup.FullName -ArgumentList $arguments -Wait -PassThru
          if ($install.ExitCode) {
            Get-Content "$lab\out\install\setup-exe.log" -ErrorAction SilentlyContinue
            throw "Setup.exe ended with exit code $($install.ExitCode)"
          }
          $service = Start-Process "$lab\.venv\Scripts\python.exe" -ArgumentList 'serve.py', '--port', '8790' -WorkingDirectory $lab -PassThru -NoNewWindow
          $health = $null
          foreach ($try in 1..60) {
            try { $health = Invoke-RestMethod http://127.0.0.1:8790/api/health -TimeoutSec 2; break } catch { Start-Sleep 1 }
          }
          if ($health.status -ne 'ready') { Stop-Process -Id $service.Id -Force; throw "The installed Lab did not answer /api/health" }
          Invoke-RestMethod -Method Post http://127.0.0.1:8790/api/characters -ContentType 'application/json' -Body '{"name": "Kept"}' | Out-Null
          Stop-Process -Id $service.Id -Force
          Start-Sleep 2
          # The uninstaller runs from a copy of itself, so wait for it to remove its own files.
          Start-Process "$lab\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          foreach ($try in 1..120) { if (-not (Test-Path "$lab\unins000.exe")) { break }; Start-Sleep 1 }
          if (Test-Path "$lab\unins000.exe") { throw "The uninstaller did not finish" }
          if (-not (Test-Path "$lab\data\cast\cast.sqlite3")) { throw "Uninstalling removed the library" }
          foreach ($gone in '.venv', '.venv-desktop', 'python', 'serve.py') {
            if (Test-Path "$lab\$gone") { throw "Uninstalling left $gone" }
          }
          "Setup.exe installed version $($health.version), the Lab answered, and uninstalling kept the library."
