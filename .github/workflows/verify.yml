name: Source verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint
        run: |
          python -m pip install -r requirements/lint.txt
          ruff check .
          ruff format --check .
      - name: Install core only
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install -r requirements/core.txt
      - name: Contracts and synthetic audio
        run: .venv/Scripts/python.exe -m unittest discover -s tests -p "test_*.py" -v
      - name: Frontend contracts
        run: node --test tests/ui_workspace.test.cjs tests/drama3_studio.test.cjs tests/theme.test.cjs tests/voice_workflows.test.cjs tests/voice_library.test.cjs tests/compare_cast.test.cjs tests/cast_reference_ui.test.cjs tests/engine_status.test.cjs tests/scene_history.test.cjs tests/take_edit_ui.test.cjs
      - name: Check the repository for secrets, private files and dead links
        run: .venv/Scripts/python.exe tools/check_repo.py
