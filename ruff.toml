# The gates CI runs: `ruff check .` and `ruff format --check .`.
# The linter keeps to rules that point at real mistakes: syntax errors, undefined names, unused imports and unused variables.
# The vendored Breeze sources are not ours to lint or reformat.
target-version = "py312"
line-length = 128
extend-exclude = ["breeze/vendor"]

[lint]
select = ["F", "E9"]

[format]
# Files written before the formatter was adopted keep their own style for now. When you rework one, run `ruff format` on it
# and take it off this list. Every file that is not on it, and every new file, is checked.
exclude = [
    "align_takes.py",
    "align_worker.py",
    "api_spec.py",
    "asr_worker.py",
    "breeze/int8.py",
    "breeze/loader.py",
    "breeze/native.py",
